apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      name: backend
      labels:
        app: backend-app
    spec:
      containers:
        - name: backend
          image: apu133/cash-tracker-backend:0.2
          ports:
            - containerPort: 5000
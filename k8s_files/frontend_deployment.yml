apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend_deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: frontend_app
  template:
    metadata:
      name: frontend
      labels:
        app: frontend_app
    spec:
      containers:
        - name: frontend
          image: apu133/cash-tracker-frontend:0.2
          ports:
            - containerPort: 3000
services:

  backend:
    build: ./backend
    image: apu133/cash-tracker-backend:0.2
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - PORT=${PORT}


  frontend:
    build: ./frontend
    image: apu133/cash-tracker-frontend:0.4
    ports:
      - "3001:80"
    environment:
      - REACT_APP_API_URL=http://backend:5000
    depends_on:
      - backend

volumes:
  mongodb_data:
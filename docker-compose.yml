services:

  backend:
    build: ./backend
    image: apu133/cash-tracker-backend:0.3
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - PORT=${PORT}
      - JWT_SECRET=${JWT_SECRET}

  frontend:
    build: ./frontend
    image: apu133/cash-tracker-frontend:0.5
    ports:
      - "3001:80"
    depends_on:
      - backend
